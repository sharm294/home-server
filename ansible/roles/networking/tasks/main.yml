- name: Check if vmbr0 bridge already exists
  ansible.builtin.command: ip link show vmbr0 type bridge
  register: bridge_check
  failed_when: false
  changed_when: false

- name: Configure Proxmox VE networking
  when: bridge_check.rc != 0
  block:
    - name: Get IP address from active route
      ansible.builtin.command: ip route get 1.2.3.4
      register: route_output
      changed_when: false

    - name: Extract IP address
      ansible.builtin.set_fact:
        ip_addr: "{{ route_output.stdout_lines[0].split()[6] }}"

    - name: Get first non-loopback network interface
      ansible.builtin.command:
        cmd: "ip -o link show | awk -F': ' '$2 != \"lo\" {print $2; exit}'"
      register: nic_output
      changed_when: false

    - name: Set NIC variable
      ansible.builtin.set_fact:
        nic: "{{ nic_output.stdout }}"

    - name: Create vmbr0 bridge
      ansible.builtin.command: ip link add name vmbr0 type bridge
      args:
        creates: /sys/class/net/vmbr0

    - name: Set vmbr0 bridge parameters
      ansible.builtin.command: "{{ item }}"
      loop:
        - ip link set vmbr0 forward_delay 0
        - ip link set vmbr0 stp_state 0

    - name: Bring vmbr0 up
      ansible.builtin.command: ip link set vmbr0 up

    - name: Flush IP from physical interface
      ansible.builtin.command: "ip addr flush dev {{ nic }}"

    - name: Add physical interface to bridge
      ansible.builtin.command: "{{ item }}"
      loop:
        - ip link set {{ nic }} master vmbr0
        - ip link set {{ nic }} up

    - name: Assign IP to bridge
      ansible.builtin.command: "ip addr add {{ ip_addr }}/24 dev vmbr0"

    - name: Set default route
      ansible.builtin.command: "ip route add default via {{ default_gateway }}"

    - name: Update resolv.conf
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        line: "search {{ search_domain }}"
        state: present

    - name: Update hostname resolution in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^(127\\.0\\.1\\.1)(\\s+.*)$"
        line: "{{ ip_addr }}\\2"
        backrefs: true

    - name: Restart pve-cluster service
      ansible.builtin.systemd:
        name: pve-cluster
        state: restarted
