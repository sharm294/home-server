---
- name: Check PVE host
  ansible.builtin.include_role:
    name: common
    tasks_from: pve_host.yml

- name: Get CPU vendor information
  ansible.builtin.command: lscpu
  register: lscpu_result
  changed_when: false

- name: Set CPU vendor fact
  ansible.builtin.set_fact:
    cpu_vendor: >-
      {{ lscpu_result.stdout
         | regex_search('Vendor ID:\s*(\S+)', '\1')
         | first | default('') }}

- name: Get current microcode revision from kernel logs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      journalctl -k | grep -i 'microcode: Current revision:' | grep -oP 'Current revision: \K0x[0-9a-f]+' | tail -n 1
  register: current_microcode
  failed_when: false
  changed_when: false

- name: Install Intel microcode
  ansible.builtin.include_tasks: intel_microcode.yml
  when:
    - cpu_vendor == "GenuineIntel"
    - microcode_install_intel

- name: Install AMD microcode
  ansible.builtin.include_tasks: amd_microcode.yml
  when:
    - cpu_vendor == "AuthenticAMD"
    - microcode_install_amd

- name: Fail if CPU vendor is not supported
  ansible.builtin.fail:
    msg: "CPU vendor '{{ cpu_vendor }}' is not supported for microcode installation"
  when:
    - cpu_vendor not in ["GenuineIntel", "AuthenticAMD"]
    - microcode_install_intel or microcode_install_amd

- name: Display reboot notification
  ansible.builtin.debug:
    msg: Microcode installation complete. A system reboot is necessary to apply the changes.
