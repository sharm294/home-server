---
- name: Ensure samba group exists
  ansible.builtin.group:
    name: "{{ samba_group }}"
    gid: "{{ samba_group_gid }}"
    state: present

- name: Ensure samba user exists
  ansible.builtin.user:
    name: "{{ samba_user }}"
    uid: "{{ samba_user_uid }}"
    shell: "{{ samba_user_shell }}"
    groups: "{{ samba_group }}"
    create_home: false
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present

- name: Check if samba user exists in Samba password database
  ansible.builtin.shell: |
    set -o pipefail
    "pdbedit -L | cut -d: -f1 | grep -x {{ samba_user }}"
  register: pdbedit_check
  failed_when: false
  changed_when: false

- name: Add samba user password if missing
  ansible.builtin.shell: |
    set -o pipefail
    "printf '%s\n%s\n' '{{ samba_password }}' '{{ samba_password }}' | smbpasswd -s -a '{{ samba_user }}'"
  when: pdbedit_check.rc != 0
  args:
    warn: false

- name: Create share directories with correct ownership and permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ samba_user }}"
    group: "{{ samba_group }}"
    mode: "{{ item.mode | default('0775') }}"
  loop: "{{ samba_shares }}"

- name: Deploy smb.conf from template
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart smbd

- name: Ensure smbd is enabled and running
  ansible.builtin.service:
    name: smbd
    enabled: true
    state: started
