---
# The samba share user and group must match the NAS user/group so that
# ownership on the ZFS datasets is consistent. Reference the shared vars
# from group_vars/all.yml rather than duplicating values here.
samba_user: "{{ nas_user }}"
samba_group: "{{ nas_group }}"
samba_user_uid: "{{ nas_uid }}"
samba_group_gid: "{{ nas_gid }}"

samba_password: changeme
samba_user_shell: /usr/sbin/nologin
samba_packages:
  - samba
  - acl
samba_shares:
  - name: nas
    path: /mnt/nas
    comment: NAS Share
    create_mask: "0664"
    directory_mask: "0775"
    mode: "0775"
  - name: media
    path: /mnt/media_root
    comment: Media Share
    create_mask: "0664"
    directory_mask: "0775"
    mode: "0775"
samba_workgroup: WORKGROUP
