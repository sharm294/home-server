---
# host_setup.yml runs on the Proxmox host (SSH, become: true).
# container.yml calls the Proxmox API and is included from the api play.
# This main.yml is only used when the role is applied in the host play;
# the api play includes container.yml directly via tasks_from.
- name: Run NAS host setup tasks
  ansible.builtin.include_tasks: host_setup.yml
