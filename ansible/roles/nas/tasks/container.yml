---
# These tasks call the Proxmox API. They are included from the api play
# (proxmox_host.yml play 2) which runs on localhost, not on the host itself.

- name: Download Debian 13 LXC template
  community.proxmox.proxmox_template:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    storage: "{{ lxc_template_storage }}"
    template: "{{ lxc_template_name }}"
    state: present

- name: Create LXC container
  community.proxmox.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ lxc_container_id }}"
    ostemplate: "{{ lxc_template_storage }}:vztmpl/{{ lxc_template_name }}"
    password: "{{ lxc_container_password }}"
    disk_volume:
      storage: local-lvm
      size: 8
    netif:
      net0: "name=eth0,ip=dhcp,ip6=dhcp,bridge=vmbr0"
    cores: "{{ lxc_container_cores }}"
    memory: "{{ lxc_container_memory }}"
    features:
      nesting: 1
    mounts:
      mp0: "/{{ zfs_pool_name }}/nas,mp=/mnt/nas"
      mp1: "/{{ zfs_pool_name }}/media_root,mp=/mnt/media_root"
    pubkey: ~/.ssh/authorized_keys
    state: present
    start: true
