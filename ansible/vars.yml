---
# This file has been superseded by group_vars/.
#
# Variable locations after reorganization:
#
#   group_vars/all.yml           — nas_user/group/uid/gid, zfs_pool_name
#   group_vars/proxmox_host.yml  — proxmox_api_*, proxmox_node, networking,
#                                  storage IDs, drive paths
#   host_vars/<hostname>.yml     — per-host overrides (drive paths, gateway)
#
# The `templates:` block below is retained here as a reference for the
# debian_template role variables. Move these into group_vars/proxmox_host.yml
# or host_vars/ once the template role is stable.

templates:
  debian:
    vmid: 8000
    name: debian-13-cloudimage

    iso_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
    checksum_url: https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS
    checksum_algorithm: sha512
    checksum_regexp: ([a-fA-F0-9]{128})\s+debian-13-genericcloud-amd64.qcow2
    tags: [debian, debian-13, template]
